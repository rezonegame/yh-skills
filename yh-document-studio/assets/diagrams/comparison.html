<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Comparison diagram</title>
<style>:root{--paper:#faf9f5;--ink:#141413;--muted:#6b6a64;--brand:#1B365D}body{background:var(--paper);color:var(--ink);font:16px Georgia,serif}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:28px}.card{border-top:4px solid var(--brand);padding:18px;background:#fff}.card h2{margin:0 0 10px}.card p{color:var(--muted)}</style>
</head><body><figure class="comparison" aria-labelledby="comparison-caption"><section class="card"><h2>Option A</h2><p>Replace with the first evidence-backed alternative.</p></section><section class="card"><h2>Option B</h2><p>Replace with the second evidence-backed alternative.</p></section><figcaption id="comparison-caption">Comparison of two alternatives; replace labels and evidence before delivery.</figcaption></figure></body></html>
