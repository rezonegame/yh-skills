<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="comparison-title comparison-desc">
  <title id="comparison-title">Two-Column Comparison Table</title>
  <desc id="comparison-desc">A comparison table with two columns showing features or attributes side by side, with alternating row backgrounds for readability.</desc>

  <style>
    text { font-family: Charter, Georgia, 'Times New Roman', serif; }
  </style>

  <!-- Background -->
  <rect width="600" height="320" fill="#F8F6F1" rx="4"/>

  <!-- Header row -->
  <rect x="20" y="20" width="560" height="44" fill="#1B365D" rx="4"/>
  <text x="170" y="48" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Option A</text>
  <text x="430" y="48" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Option B</text>

  <!-- Divider line -->
  <line x1="300" y1="20" x2="300" y2="290" stroke="#C5BFA8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Row 1 -->
  <rect x="20" y="72" width="560" height="44" fill="#EDE9E0"/>
  <text x="40" y="99" fill="#2D3748" font-size="12" font-weight="bold">Performance</text>
  <text x="170" y="99" text-anchor="middle" fill="#2D3748" font-size="12">High throughput</text>
  <text x="430" y="99" text-anchor="middle" fill="#2D3748" font-size="12">Low latency</text>

  <!-- Row 2 -->
  <rect x="20" y="124" width="560" height="44" fill="#F8F6F1"/>
  <text x="40" y="151" fill="#2D3748" font-size="12" font-weight="bold">Cost</text>
  <text x="170" y="151" text-anchor="middle" fill="#2D3748" font-size="12">Lower upfront</text>
  <text x="430" y="151" text-anchor="middle" fill="#2D3748" font-size="12">Higher upfront</text>

  <!-- Row 3 -->
  <rect x="20" y="176" width="560" height="44" fill="#EDE9E0"/>
  <text x="40" y="203" fill="#2D3748" font-size="12" font-weight="bold">Scalability</text>
  <text x="170" y="203" text-anchor="middle" fill="#2D3748" font-size="12">Horizontal</text>
  <text x="430" y="203" text-anchor="middle" fill="#2D3748" font-size="12">Vertical</text>

  <!-- Row 4 -->
  <rect x="20" y="228" width="560" height="44" fill="#F8F6F1"/>
  <text x="40" y="255" fill="#2D3748" font-size="12" font-weight="bold">Maintenance</text>
  <text x="170" y="255" text-anchor="middle" fill="#2D3748" font-size="12">More complex</text>
  <text x="430" y="255" text-anchor="middle" fill="#2D3748" font-size="12">Simpler</text>

  <!-- Caption -->
  <text x="300" y="305" text-anchor="middle" fill="#4A5568" font-size="11" font-style="italic">Key trade-offs between Option A and Option B</text>
</svg>
